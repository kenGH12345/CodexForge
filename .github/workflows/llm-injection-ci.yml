name: Unified LLM Injection CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  llm-injection-ci:
    name: LLM Injection Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unified LLM Injection CI gate
        run: npm run ci:llm-injection

      - name: Run Unified LLM Injection SLO dashboard
        run: npm run slo:llm-injection

      - name: Run fast test suite
        run: npm test -- --profile=fast

      - name: Upload LLM injection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-injection-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            output/unified-llm-injection-ci-gate.md
            output/unified-llm-injection-ci-gate.json
            output/unified-llm-injection-default-runtime-replacement.json
            output/unified-llm-injection-runtime-readiness-gate.json
            output/unified-llm-injection-slo-dashboard.md
            output/unified-llm-injection-slo-dashboard.json
            output/unified-llm-injection-release-health-summary.md
            output/test-execution-proof.json
            output/completion-contract-result.json

